        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;

        }

        /* Custom scrollbar for mobile screen simulator */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .phone-frame {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 12px #1e293b;
            border-radius: 40px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .ios-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 28px;
            background-color: #1e293b;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 50;
        }

        .screen-fade {
            animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast styling */
        .toast {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const message = document.getElementById('toast-message');

            message.textContent = msg;
            icon.className = isSuccess ? 'fa-solid fa-circle-check text-emerald-400 text-lg' : 'fa-solid fa-circle-exclamation text-amber-400 text-lg';
            
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function toggleDeviceFrame(isMobile) {
            state.deviceFrameMode = isMobile;
            const wrapper = document.getElementById('device-wrapper');
            const btnMobile = document.getElementById('btn-frame-mobile');
            const btnFull = document.getElementById('btn-frame-full');

            if (isMobile) {
                wrapper.className = "phone-frame relative bg-white w-full max-w-[410px] h-[820px] flex flex-col border-[6px] border-slate-800 shadow-2xl";
                btnMobile.className = "px-3 py-1.5 rounded-lg bg-white shadow-xs text-slate-800 font-bold";
                btnFull.className = "px-3 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 font-normal";
            } else {
                wrapper.className = "relative bg-white w-full max-w-4xl h-[820px] rounded-3xl flex flex-col border border-slate-300 shadow-xl overflow-hidden";
                btnFull.className = "px-3 py-1.5 rounded-lg bg-white shadow-xs text-slate-800 font-bold";
                btnMobile.className = "px-3 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 font-normal";
            }
        }

        function switchRole(role) {
            state.currentRole = role;
            
            // Update Top Bar styling
            document.getElementById('btn-role-cliente').className = role === 'CLIENTE' ? 'px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center gap-2 bg-brand-600 text-white shadow-sm' : 'px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center gap-2 text-slate-600 hover:text-slate-900';
            document.getElementById('btn-role-prestador').className = role === 'PRESTADOR' ? 'px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center gap-2 bg-emerald-600 text-white shadow-sm' : 'px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center gap-2 text-slate-600 hover:text-slate-900';
            document.getElementById('btn-role-admin').className = role === 'ADMIN' ? 'px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center gap-2 bg-indigo-600 text-white shadow-sm' : 'px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center gap-2 text-slate-600 hover:text-slate-900';

            if (role === 'CLIENTE') {
                navigate('HOME');
            } else if (role === 'PRESTADOR') {
                navigate('HOME_PRESTADOR');
            } else if (role === 'ADMIN') {
                navigate('ADMIN_DASHBOARD');
            }
        }

        function navigate(screenKey, payload = null) {
            state.currentScreen = screenKey;
            if (payload) {
                if (payload.request) state.selectedRequest = payload.request;
                if (payload.provider) state.selectedProvider = payload.provider;
            }
            render();
        }

        function toggleUrgentMode(checked) {
            state.isUrgentMode = checked;
            render();
        }

        function openEmergencyRequest() {
            state.isUrgentMode = true;
            state.selectedCategory = 'Hidráulica';
            navigate('NEW_REQUEST');
        }

        function handleCreateRequest(e) {
            e.preventDefault();
            const cat = document.getElementById('req-cat').value;
            const title = document.getElementById('req-title').value;
            const desc = document.getElementById('req-desc').value;
            const loc = document.getElementById('req-loc').value;
            const date = document.getElementById('req-date').value;
            const time = document.getElementById('req-time').value;
            const budget = document.getElementById('req-budget').value;
            const isUrgent = document.getElementById('req-is-urgent').checked;

            const newReq = {
                id: 'REQ-' + Math.floor(100 + Math.random() * 900),
                category: cat,
                title: title,
                description: desc,
                location: loc,
                distance: '1,2 km',
                date: date,
                timeSlot: time,
                budget: budget || 'A combinar',
                status: 'Aberto',
                createdAt: 'Agora mesmo',
                isUrgent: isUrgent,
                proposalsCount: 0,
                proposals: []
            };

            state.requests.unshift(newReq);
            state.clientUser.totalRequests += 1;
            state.clientUser.activeRequests += 1;
            
            showToast(isUrgent ? 'Chamado de Emergência publicado!' : 'Solicitação criada com sucesso!');
            navigate('PROPOSALS', { request: newReq });
        }

        function handleHireProvider(providerName) {
            showToast(`Proposta de ${providerName} aceita!`);
            navigate('CHAT');
        }

        function handleSendMessage() {
            const input = document.getElementById('chat-input');
            if (!input || !input.value.trim()) return;

            const text = input.value.trim();
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            state.chatMessages.push({
                sender: 'client',
                text: text,
                time: timeStr
            });

            input.value = '';
            render();
        }

        function handleSendProposalSubmit(e) {
            e.preventDefault();
            showToast('Sua proposta foi enviada ao cliente com sucesso!');
            navigate('HOME_PRESTADOR');
        }

                nav.innerHTML = `
                    <button onclick="navigate('HOME_PRESTADOR')" class="flex flex-col items-center gap-1 ${state.currentScreen === 'HOME_PRESTADOR' ? 'text-emerald-600 font-bold' : 'text-slate-400'}">
                        <i class="fa-solid fa-chart-pie text-base"></i>
                        <span class="text-[9px]">Início</span>
                    </button>
                    <button onclick="navigate('OPPORTUNITIES')" class="flex flex-col items-center gap-1 ${state.currentScreen === 'OPPORTUNITIES' || state.currentScreen === 'SEND_PROPOSAL' ? 'text-emerald-600 font-bold' : 'text-slate-400'}">
                        <i class="fa-solid fa-satellite-dish text-base"></i>
                        <span class="text-[9px]">Radar</span>
                    </button>
                    <button onclick="navigate('MY_SERVICES')" class="flex flex-col items-center gap-1 ${state.currentScreen === 'MY_SERVICES' ? 'text-emerald-600 font-bold' : 'text-slate-400'}">
                        <i class="fa-solid fa-briefcase text-base"></i>
                        <span class="text-[9px]">Serviços</span>
                    </button>
                    <button onclick="navigate('PROFILE_PRESTADOR')" class="flex flex-col items-center gap-1 ${state.currentScreen === 'PROFILE_PRESTADOR' ? 'text-emerald-600 font-bold' : 'text-slate-400'}">
                        <i class="fa-solid fa-id-card text-base"></i>
                        <span class="text-[9px]">Meu Perfil</span>
                    </button>
                `;
            } else if (state.currentRole === 'ADMIN') {
                nav.innerHTML = `
                    <button onclick="navigate('ADMIN_DASHBOARD')" class="flex flex-col items-center gap-1 ${state.currentScreen === 'ADMIN_DASHBOARD' ? 'text-indigo-600 font-bold' : 'text-slate-400'}">
                        <i class="fa-solid fa-chart-line text-base"></i>
                        <span class="text-[9px]">Dashboard</span>
                    </button>
                    <button onclick="navigate('ADMIN_REQUESTS')" class="flex flex-col items-center gap-1 ${state.currentScreen === 'ADMIN_REQUESTS' ? 'text-indigo-600 font-bold' : 'text-slate-400'}">
                        <i class="fa-solid fa-list-check text-base"></i>
                        <span class="text-[9px]">Chamados</span>
                    </button>
                `;
            }
        }

        function render() {
            if (state.currentRole === 'CLIENTE') {
                renderClienteScreen();
            } else if (state.currentRole === 'PRESTADOR') {
                renderPrestadorScreen();
            } else if (state.currentRole === 'ADMIN') {
                renderAdminScreen();
            }
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
